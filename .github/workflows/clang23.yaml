on:
  push:
    branches: [main, master, "hotfix/**"]
  pull_request:
  workflow_dispatch:

name: clang23-libcxx.yaml

permissions: read-all

jobs:
  clang23-libcxx:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_MAKEVARS_USER: ${{ runner.temp }}/Makevars-clang23

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true

      - name: Install LLVM 23 and libc++ 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" |
            sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-23 libc++-23-dev libc++abi-23-dev

      - name: Configure R for LLVM 23 with libc++
        run: |
          printf '%s\n' \
            'CC = clang-23' \
            'CXX = clang++-23 -stdlib=libc++' \
            'CXX11 = clang++-23 -stdlib=libc++' \
            'CXX14 = clang++-23 -stdlib=libc++' \
            'CXX17 = clang++-23 -stdlib=libc++' \
            'CXX20 = clang++-23 -stdlib=libc++' \
            'CXX23 = clang++-23 -stdlib=libc++' \
            > "${R_MAKEVARS_USER}"
          clang++-23 --version
          dpkg-query --show --showformat='${Package} ${Version}\n' \
            clang-23 libc++-23-dev libc++abi-23-dev

      - name: Verify the clang 23 transitive-include regression
        run: |
          set -eu
          R_INCLUDE="$(R RHOME)/include"
          clang++-23 -stdlib=libc++ -std=gnu++17 -DNDEBUG \
            -I"${R_INCLUDE}" -Isrc -fsyntax-only src/native_operators.cpp
          if tail -n +2 src/native_operators.cpp | \
              clang++-23 -stdlib=libc++ -std=gnu++17 -DNDEBUG \
                -I"${R_INCLUDE}" -Isrc -x c++ -fsyntax-only - \
                2> "${RUNNER_TEMP}/no-algorithm.log"; then
            echo "negative control unexpectedly compiled"
            exit 1
          fi
          grep -F "no member named 'fill' in namespace 'std'" \
            "${RUNNER_TEMP}/no-algorithm.log"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check source package with LLVM 23 and libc++ 23
        run: |
          result <- rcmdcheck::rcmdcheck(
            path = ".",
            args = c("--as-cran", "--no-manual"),
            build_args = "--no-manual",
            error_on = "never",
            quiet = FALSE
          )
          if (length(result$errors) || length(result$warnings)) {
            quit(status = 1L)
          }
        shell: Rscript {0}
