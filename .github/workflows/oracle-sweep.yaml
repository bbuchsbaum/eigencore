# Oracle-based differential sweep at the "extended" level (15000 cases,
# helper-oracle.R): every case is solved by eigencore and checked against
# base eigen()/svd(). See docs/test-assurance.md.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Oracle level (cran, ci, extended)"
        required: false
        default: "extended"
      ids:
        description: "Optional case ids, e.g. 1:500,4711 (overrides level)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"

name: oracle-sweep.yaml

permissions: read-all

jobs:
  oracle-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      EIGENCORE_ORACLE_LEVEL: ${{ github.event.inputs.level || 'extended' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::callr, any::RSpectra, local::.
          needs: check

      - name: Run oracle sweep
        shell: bash
        run: |
          ids="${{ github.event.inputs.ids }}"
          if [ -n "$ids" ]; then
            Rscript tools/oracle_sweep.R --ids "$ids" --workers 2 --out oracle-out
          else
            Rscript tools/oracle_sweep.R --level "$EIGENCORE_ORACLE_LEVEL" --workers 2 --out oracle-out
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f oracle-out/summary.md ]; then
            head -c 900000 oracle-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-sweep-${{ github.run_id }}
          path: oracle-out/
          if-no-files-found: warn
